<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teknik Komputer Jaringan</title>

    <!-- Font Google (boleh dihapus; kalau gagal dimuat, browser pakai font sistem) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- BAGIAN 1: CSS (TAMPILAN) -->
    <style>
        :root {
            --bg: #eef2f7;
            --kartu: #ffffff;
            --teks: #14213d;
            --teks-redup: #5b667a;
            --garis: #d6dde8;
            --aksen: #1d4ed8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1522;
                --kartu: #172033;
                --teks: #e8edf6;
                --teks-redup: #98a4ba;
                --garis: #2a3650;
                --aksen: #6c9bff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--teks);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        .wadah {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 1.75rem;
            font-weight: 800;
        }

        header p {
            margin: 0;
            color: var(--teks-redup);
        }

        /* Kolom pencarian dan filter */
        .kontrol {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0 8px;
        }

        .kontrol input,
        .kontrol select {
            font: inherit;
            color: var(--teks);
            background: var(--kartu);
            border: 1px solid var(--garis);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .kontrol input {
            flex: 1 1 220px;
        }

        .kontrol select {
            flex: 0 1 160px;
        }

        .kontrol input:focus-visible,
        .kontrol select:focus-visible {
            outline: 2px solid var(--aksen);
            outline-offset: 1px;
        }

        .jumlah {
            color: var(--teks-redup);
            font-size: 0.9rem;
            margin: 0 0 16px;
        }

        /* Susunan kartu: otomatis menyesuaikan lebar layar */
        .daftar {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        /* Kartu mirip kartu pelajar */
        .kartu {
            background: var(--kartu);
            border: 1px solid var(--garis);
            border-radius: 14px;
            overflow: hidden;
        }

        .pita {
            height: 56px;
            background: cyan;
        }

        .isi {
            padding: 0 16px 16px;
            text-align: center;
        }

        .foto {
            width: 76px;
            height: 76px;
            margin: -38px auto 8px;
            border-radius: 50%;
            border: 4px solid var(--kartu);
            background: hsl(var(--hue) 55% 88%);
            color: hsl(var(--hue) 65% 28%);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.5rem;
            overflow: hidden;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nama {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .nis {
            margin: 0 0 12px;
            color: var(--teks-redup);
            font-size: 0.85rem;
        }

        .rincian {
            margin: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .rincian div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0;
            border-top: 1px solid var(--garis);
        }

        .rincian dt {
            color: var(--teks-redup);
        }

        .rincian dd {
            margin: 0;
            font-weight: 600;
            text-align: right;
        }

        /* Pesan status: memuat, kosong, galat */
        .pesan {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--teks-redup);
        }

        .pesan.galat {
            color: #b42318;
        }

        @media (prefers-color-scheme: dark) {
            .pesan.galat {
                color: #ff8b80;
            }
        }

        .foto { cursor: zoom-in; border: 0; padding: 0; }
        .foto:focus-visible { outline: 3px solid var(--aksen); outline-offset: 3px; }
        .aksi-atas { display:flex; justify-content:flex-end; margin: 16px 0 8px; }
        .tombol { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px;
            background: var(--aksen); color: white; cursor: pointer; font-weight: 600; }
        .tombol-sekunder { background: var(--garis); color: var(--teks); }
        .modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center;
            justify-content:center; padding:18px; background:rgba(0,0,0,.78); }
        .modal.aktif { display:flex; }
        .modal-konten { position:relative; max-width:min(92vw,720px); max-height:90vh;
            background:var(--kartu); color:var(--teks); border:1px solid var(--garis);
            border-radius:14px; padding:16px; text-align:center; overflow:auto; }
        .modal-gambar { display:block; max-width:100%; max-height:70vh; object-fit:contain; margin:auto; }
        .modal-inisial { width:min(70vw,320px); height:min(70vw,320px); border-radius:50%;
            display:grid; place-items:center; margin:auto; font-size:4rem; font-weight:800;
            background:var(--bg); color:var(--teks); }
        .modal-tutup { position:absolute; right:8px; top:8px; border:0; border-radius:50%;
            width:38px; height:38px; font-size:24px; cursor:pointer; background:var(--bg); color:var(--teks); }
        .form-modal { display:none; position:fixed; inset:0; z-index:900; overflow:auto;
            padding:18px; background:rgba(0,0,0,.72); align-items:center; justify-content:center; }
        .form-modal.aktif { display:flex; }
        .form-konten { width:min(100%,520px); max-height:92vh; overflow:auto; background:var(--kartu);
            color:var(--teks); border:1px solid var(--garis); border-radius:14px; padding:20px; }
        .form-konten h2 { margin-top:0; }
        .form-grid { display:grid; gap:12px; }
        .form-grid label { display:grid; gap:5px; font-size:.92rem; }
        .form-grid input, .form-grid select { width:100%; font:inherit; color:var(--teks);
            background:var(--bg); border:1px solid var(--garis); border-radius:9px; padding:10px; }
        .form-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:16px; }

    </style>
</head>

<body>
    <!-- BAGIAN 2: HTML (KERANGKA HALAMAN) -->
    <div class="wadah">
        <header>
            <h1>Teknik Komputer Jaringan</h1>
            <p>Data Guru/Siswa</p>
        </header>

        <div class="kontrol">
            <input
                id="cari"
                type="search"
                placeholder="Cari nama atau NIS"
                aria-label="Cari nama atau NIS"
            >

            <select id="filterKelas" aria-label="Filter kelas">
                <option value="">Semua kelas</option>
            </select>
        </div>

        <div class="aksi-atas">
            <button id="bukaForm" class="tombol" type="button">+ Tambah data</button>
        </div>
        <p id="jumlah" class="jumlah" aria-live="polite"></p>
        <main id="daftar" class="daftar"></main>
    </div>

    <!-- Library Supabase dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>


    <div id="modalFoto" class="modal" role="dialog" aria-modal="true" aria-label="Preview foto">
        <div class="modal-konten">
            <button id="tutupFoto" class="modal-tutup" type="button" aria-label="Tutup preview">×</button>
            <img id="gambarPreview" class="modal-gambar" alt="Preview foto profil">
            <div id="inisialPreview" class="modal-inisial" hidden></div>
            <p id="namaPreview"></p>
        </div>
    </div>

    <div id="modalForm" class="form-modal" role="dialog" aria-modal="true" aria-labelledby="judulForm">
        <div class="form-konten">
            <h2 id="judulForm">Tambah data siswa</h2>
            <form id="formSiswa" class="form-grid">
                <label>NIS * <input name="nis" required maxlength="40"></label>
                <label>Nama lengkap * <input name="nama" required maxlength="100"></label>
                <label>Kelas * <input name="kelas" required maxlength="50" placeholder="Contoh: XI-TKJ-1"></label>
                <label>Jenis kelamin
                    <select name="jenis_kelamin">
                        <option value="">Pilih (opsional)</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </label>
                <label>Tanggal lahir <input name="tanggal_lahir" type="date"></label>
                <label>Alamat <input name="alamat" maxlength="250"></label>
                <label>URL foto profil (opsional) <input name="foto_url" type="url" placeholder="https://..."></label>
                <div class="form-actions">
                    <button id="batalForm" class="tombol tombol-sekunder" type="button">Batal</button>
                    <button id="simpanSiswa" class="tombol" type="submit">Simpan data</button>
                </div>
                <p id="pesanForm" role="status"></p>
            </form>
        </div>
    </div>

    <!-- BAGIAN 3: JAVASCRIPT (LOGIKA) -->
    <script>
        // LANGKAH 1: PENGATURAN
        // Ganti dua nilai ini dengan milik projectmu.
        const SUPABASE_URL = "https://ivvhapjqwuulruufujlm.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_OBF96Mb3IoRCg7MgZTGmFg_Pel36cOX";

        // Pilih data pribadi mana yang boleh tampil.
        // true = tampil, false = disembunyikan.
        const TAMPILKAN = {
            jenisKelamin: true,
            tanggalLahir: false,
            alamat: false
        };

        // LANGKAH 2: HUBUNGKAN KE SUPABASE
        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // Ambil elemen HTML
        const elDaftar = document.getElementById("daftar");
        const elJumlah = document.getElementById("jumlah");
        const elCari = document.getElementById("cari");
        const elKelas = document.getElementById("filterKelas");

        // Tempat menyimpan seluruh data siswa
        let semuaSiswa = [];

        // LANGKAH 3: AMBIL DATA
        async function muatData() {
            tampilkanPesan("Memuat data siswa...");

            // Sama artinya dengan SQL:
            // SELECT nis, nama, ... FROM siswa ORDER BY nama
            const { data, error } = await db
                .from("siswa")
                .select("nis, nama, kelas, jenis_kelamin, tanggal_lahir, alamat, foto_url")
                .order("nama");

            if (error) {
                console.error(error);

                tampilkanPesan(
                    "Data tidak bisa dimuat. Periksa URL dan anon key, nama tabel, serta policy RLS di Supabase.",
                    true
                );

                return;
            }

            semuaSiswa = data;
            isiPilihanKelas();
            tampilkanSiswa();
        }

        // LANGKAH 4: TAMPILKAN KARTU
        function tampilkanSiswa() {
            const kataKunci = elCari.value.trim().toLowerCase();
            const kelasDipilih = elKelas.value;

            // Saring data sesuai pencarian dan kelas
            const hasil = semuaSiswa.filter((s) => {
                const cocokKelas =
                    !kelasDipilih || s.kelas === kelasDipilih;

                const cocokCari =
                    !kataKunci ||
                    s.nama.toLowerCase().includes(kataKunci) ||
                    s.nis.toLowerCase().includes(kataKunci);

                return cocokKelas && cocokCari;
            });

            elJumlah.textContent =
                hasil.length + " dari " + semuaSiswa.length + " siswa";

            elDaftar.replaceChildren();

            if (hasil.length === 0) {
                tampilkanPesan(
                    semuaSiswa.length === 0
                        ? "Belum ada data siswa. Tekan + Tambah data untuk menambahkan siswa."
                        : "Tidak ada siswa yang cocok. Coba kata kunci atau kelas lain."
                );

                return;
            }

            hasil.forEach((s) => {
                elDaftar.appendChild(buatKartu(s));
            });
        }

        // Membuat satu kartu dari satu baris data siswa.
        function buatKartu(s) {
            const kartu = el("article", "kartu");
            kartu.style.setProperty("--hue", warnaKelas(s.kelas));

            kartu.appendChild(el("div", "pita"));

            const isi = el("div", "isi");

            // Foto bisa ditekan untuk membuka preview ukuran besar.
            const foto = el("button", "foto");
            foto.type = "button";
            foto.setAttribute("aria-label", "Lihat foto profil " + s.nama);

            if (s.foto_url) {
                const gambar = document.createElement("img");
                gambar.src = s.foto_url;
                gambar.alt = "Foto " + s.nama;
                gambar.loading = "lazy";
                gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
                foto.appendChild(gambar);
            } else {
                foto.textContent = inisial(s.nama);
            }

            foto.addEventListener("click", () => bukaPreview(s));
            isi.appendChild(foto);

            isi.appendChild(el("h2", "nama", s.nama));
            isi.appendChild(el("p", "nis", "NIS " + s.nis));

            // Daftar rincian
            const rincian = el("dl", "rincian");

            tambahBaris(rincian, "Kelas", s.kelas);

            if (TAMPILKAN.jenisKelamin) {
                tambahBaris(
                    rincian,
                    "Jenis kelamin",
                    s.jenis_kelamin
                );
            }

            if (TAMPILKAN.tanggalLahir) {
                tambahBaris(
                    rincian,
                    "Tanggal lahir",
                    formatTanggal(s.tanggal_lahir)
                );
            }

            if (TAMPILKAN.alamat) {
                tambahBaris(rincian, "Alamat", s.alamat);
            }

            isi.appendChild(rincian);
            kartu.appendChild(isi);

            return kartu;
        }

        // FUNGSI BANTU
        // Membuat elemen HTML dengan kelas dan teks.
        function el(tag, kelas, teks) {
            const e = document.createElement(tag);

            if (kelas) e.className = kelas;
            if (teks) e.textContent = teks;

            return e;
        }

        function tambahBaris(dl, label, nilai) {
            if (!nilai) return;

            const baris = el("div");

            baris.appendChild(el("dt", "", label));
            baris.appendChild(el("dd", "", nilai));

            dl.appendChild(baris);
        }

        // "Budi Santoso" -> "BS"
        function inisial(nama) {
            return nama
                .split(" ")
                .filter(Boolean)
                .slice(0, 2)
                .map((k) => k[0].toUpperCase())
                .join("");
        }

        // Setiap kelas mendapat warna sendiri secara otomatis.
        function warnaKelas(kelas) {
            let total = 0;

            for (const huruf of kelas || "") {
                total += huruf.charCodeAt(0);
            }

            return (total * 47) % 360;
        }

        // "2010-05-17" -> "17 Mei 2010"
        function formatTanggal(teks) {
            if (!teks) return "";

            return new Date(teks + "T00:00:00")
                .toLocaleDateString("id-ID", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        }

        function tampilkanPesan(teks, galat) {
            elDaftar.replaceChildren(
                el(
                    "p",
                    "pesan" + (galat ? " galat" : ""),
                    teks
                )
            );
        }

        // Isi pilihan filter kelas dari data yang ada.
        function isiPilihanKelas() {
            const nilaiSebelumnya = elKelas.value;
            elKelas.replaceChildren(new Option("Semua kelas", ""));
            const daftarKelas = [...new Set(semuaSiswa.map((s) => s.kelas).filter(Boolean))].sort();
            daftarKelas.forEach((k) => elKelas.appendChild(new Option(k, k)));
            if ([...elKelas.options].some((o) => o.value === nilaiSebelumnya)) {
                elKelas.value = nilaiSebelumnya;
            }
        }

        // Preview foto profil
        const modalFoto = document.getElementById("modalFoto");
        const gambarPreview = document.getElementById("gambarPreview");
        const inisialPreview = document.getElementById("inisialPreview");
        const namaPreview = document.getElementById("namaPreview");
        const modalForm = document.getElementById("modalForm");
        const formSiswa = document.getElementById("formSiswa");
        const pesanForm = document.getElementById("pesanForm");
        const tombolSimpan = document.getElementById("simpanSiswa");

        function bukaPreview(s) {
            namaPreview.textContent = s.nama || "";
            if (s.foto_url) {
                gambarPreview.src = s.foto_url;
                gambarPreview.alt = "Foto profil " + s.nama;
                gambarPreview.hidden = false;
                inisialPreview.hidden = true;
                gambarPreview.onerror = () => {
                    gambarPreview.hidden = true;
                    inisialPreview.hidden = false;
                    inisialPreview.textContent = inisial(s.nama);
                };
            } else {
                gambarPreview.removeAttribute("src");
                gambarPreview.hidden = true;
                inisialPreview.hidden = false;
                inisialPreview.textContent = inisial(s.nama);
            }
            modalFoto.classList.add("aktif");
        }

        function tutupPreview() {
            modalFoto.classList.remove("aktif");
            gambarPreview.removeAttribute("src");
        }

        document.getElementById("tutupFoto").addEventListener("click", tutupPreview);
        modalFoto.addEventListener("click", (e) => {
            if (e.target === modalFoto) tutupPreview();
        });
        document.getElementById("bukaForm").addEventListener("click", () => {
            formSiswa.reset();
            pesanForm.textContent = "";
            modalForm.classList.add("aktif");
        });
        document.getElementById("batalForm").addEventListener("click", () => {
            modalForm.classList.remove("aktif");
        });
        modalForm.addEventListener("click", (e) => {
            if (e.target === modalForm) modalForm.classList.remove("aktif");
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                tutupPreview();
                modalForm.classList.remove("aktif");
            }
        });

        // Simpan langsung ke tabel Supabase yang sama, tanpa membuka Table Editor.
        formSiswa.addEventListener("submit", async (e) => {
            e.preventDefault();
            pesanForm.textContent = "";
            tombolSimpan.disabled = true;
            tombolSimpan.textContent = "Menyimpan...";

            const f = new FormData(formSiswa);
            const siswaBaru = {
                nis: String(f.get("nis") || "").trim(),
                nama: String(f.get("nama") || "").trim(),
                kelas: String(f.get("kelas") || "").trim(),
                jenis_kelamin: String(f.get("jenis_kelamin") || "").trim() || null,
                tanggal_lahir: String(f.get("tanggal_lahir") || "").trim() || null,
                alamat: String(f.get("alamat") || "").trim() || null,
                foto_url: String(f.get("foto_url") || "").trim() || null
            };

            try {
                const { data, error } = await db.from("siswa").insert([siswaBaru])
                    .select("nis, nama, kelas, jenis_kelamin, tanggal_lahir, alamat, foto_url");

                if (error) throw error;
                if (data && data.length) {
                    semuaSiswa.push(data[0]);
                    semuaSiswa.sort((a, b) => String(a.nama).localeCompare(String(b.nama), "id"));
                    isiPilihanKelas();
                    tampilkanSiswa();
                } else {
                    await muatData();
                }

                formSiswa.reset();
                pesanForm.textContent = "Data berhasil disimpan ke database.";
                modalForm.classList.remove("aktif");
            } catch (error) {
                console.error("Gagal menyimpan data siswa:", error);
                pesanForm.textContent = error.message && /row-level security|permission|policy/i.test(error.message)
                    ? "Data ditolak oleh izin database. Supabase perlu mengizinkan INSERT untuk pengguna website."
                    : "Data gagal disimpan. Periksa koneksi dan izin INSERT tabel siswa di Supabase.";
            } finally {
                tombolSimpan.disabled = false;
                tombolSimpan.textContent = "Simpan data";
            }
        });

        // JALANKAN
        // Perbarui kartu saat pengunjung mencari atau memfilter.
        elCari.addEventListener("input", tampilkanSiswa);
        elKelas.addEventListener("change", tampilkanSiswa);

        muatData();
    </script>
</body>
</html>
